name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # Stage 1: Build - install dependencies and build the site into dist/
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  # Stage 2: Test - run Jest unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Stage 3: Deploy - push to Vercel production, health check, rollback on failure
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Only deploy real pushes to main (PRs and dev only build + test)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remember current production deployment (for rollback)
        id: previous
        run: |
          PREV=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].uid // empty')
          echo "Current production deployment: ${PREV:-none}"
          echo "id=$PREV" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        id: health
        env:
          # Public production URL. The per-deploy URL is login-protected by Vercel,
          # so we always check the production domain.
          APP_URL: ${{ vars.APP_URL || 'https://guess-the-number-omega-seven.vercel.app' }}
        run: |
          sleep 10
          bash scripts/healthcheck.sh "$APP_URL" health.log

      - name: Rollback on failed health check
        if: failure() && steps.health.outcome == 'failure' && steps.previous.outputs.id != ''
        run: |
          echo "Health check failed, rolling back to ${{ steps.previous.outputs.id }}"
          vercel rollback ${{ steps.previous.outputs.id }} --token=${{ secrets.VERCEL_TOKEN }} --scope=$VERCEL_ORG_ID
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') | ROLLBACK | restored ${{ steps.previous.outputs.id }}" >> health.log

      - name: Build status dashboard
        if: always()
        run: bash scripts/dashboard.sh health.log status.html || true

      - name: Upload health log and dashboard
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-report
          path: |
            health.log
            status.html
