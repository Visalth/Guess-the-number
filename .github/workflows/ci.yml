name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # Stage 1: Build - install dependencies and build the site into dist/
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Stage 2: Test - run Jest unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Stage 3: Deploy - push to Vercel production, health check, rollback on failure
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Only deploy real pushes to main (PRs and dev only build + test)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        id: health
        env:
          # Use the public production URL if set (repo variable APP_URL),
          # otherwise the URL returned by the deploy step.
          APP_URL: ${{ vars.APP_URL || steps.deploy.outputs.url }}
        run: |
          sleep 10
          bash scripts/healthcheck.sh "$APP_URL" health.log

      - name: Rollback on failed health check
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Health check failed, rolling back to previous production deployment"
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }}
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') | ROLLBACK | previous deployment restored" >> health.log

      - name: Build status dashboard
        if: always()
        run: bash scripts/dashboard.sh health.log status.html || true

      - name: Upload health log and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            health.log
            status.html
